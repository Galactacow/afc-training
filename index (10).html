<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFC OKC — Tech Training Portal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface2: #f1f2f4;
    --border: rgba(15,23,42,0.08);
    --border2: rgba(15,23,42,0.16);
    --text: #0f172a;
    --text2: #475569;
    --text3: #94a3b8;
    --red: #d61f1f;
    --red-dark: #b81818;
    --red-light: #fdeaea;
    --shadow-sm: 0 1px 2px rgba(15,23,42,0.04), 0 1px 3px rgba(15,23,42,0.06);
    --shadow-md: 0 4px 12px rgba(15,23,42,0.08);
    --radius: 10px;
    --radius-lg: 16px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  .app { max-width: 820px; margin: 0 auto; padding: 0 0 4rem; }

  /* Header */
  .header { display: flex; align-items: center; gap: 14px; background: linear-gradient(135deg, #d61f1f 0%, #a81414 100%); padding: 1.5rem 1.5rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-md); }
  .logo { width: 50px; height: 50px; border-radius: 12px; background: rgba(255,255,255,0.16); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2); }
  .logo i { font-size: 27px; color: #fff; }
  .header h1 { font-size: 21px; font-weight: 600; color: #fff; letter-spacing: -0.01em; }
  .header p { font-size: 13px; color: rgba(255,255,255,0.8); margin-top: 3px; }
  .module-grid, .content { margin-left: 1rem; margin-right: 1rem; }

  /* Module grid */
  .module-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
  .mod-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.1rem; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; box-shadow: var(--shadow-sm); }
  .mod-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .mod-card.active { border-color: var(--red); box-shadow: 0 0 0 1px var(--red), var(--shadow-md); }
  .mod-icon { width: 40px; height: 40px; border-radius: 11px; display: flex; align-items: center; justify-content: center; margin-bottom: 11px; font-size: 21px; }
  .mod-card h3 { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 9px; line-height: 1.4; letter-spacing: -0.01em; }
  .progress-bar { height: 5px; background: var(--surface2); border-radius: 5px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--red), #ef4444); border-radius: 5px; transition: width 0.4s ease; }
  .mod-pct { font-size: 11px; color: var(--text3); margin-top: 6px; font-weight: 500; }

  /* Content panel */
  .content { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: var(--shadow-sm); }
  .content-header { display: flex; align-items: center; gap: 11px; margin-bottom: 1.25rem; padding-bottom: 1.1rem; border-bottom: 1px solid var(--border); }
  .content-header h2 { font-size: 17px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; margin-left: auto; flex-shrink: 0; }
  .badge-done { background: #dcfce7; color: #15803d; }
  .badge-pend { background: #fef3c7; color: #b45309; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 1.25rem; background: var(--surface2); padding: 4px; border-radius: 12px; }
  .tab { flex: 1; padding: 10px; font-size: 13px; font-weight: 600; text-align: center; border: none; background: transparent; color: var(--text2); cursor: pointer; border-radius: 9px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.18s ease; }
  .tab:hover:not(.active) { color: var(--text); }
  .tab.active { background: var(--surface); color: var(--red); box-shadow: var(--shadow-sm); }

  /* Steps */
  .step-list { list-style: none; margin-bottom: 1.5rem; }
  .step-item { display: flex; align-items: flex-start; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--border); }
  .step-item:last-child { border-bottom: none; }
  .step-num { font-size: 11px; color: var(--text3); min-width: 18px; padding-top: 3px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .step-cb { width: 21px; height: 21px; border: 2px solid var(--border2); border-radius: 6px; cursor: pointer; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; background: transparent; }
  .step-cb:hover { border-color: var(--red); }
  .step-cb.checked { background: var(--red); border-color: var(--red); }
  .step-cb.checked::after { content: ''; width: 10px; height: 6px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translateY(-1px); display: block; }
  .step-body { flex: 1; }
  .step-text { font-size: 14px; color: var(--text); line-height: 1.55; cursor: pointer; }
  .step-text.done { color: var(--text3); text-decoration: line-through; }
  .step-ref { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--red); margin-top: 6px; cursor: pointer; padding: 3px 8px; background: var(--red-light); border-radius: 6px; transition: background 0.15s; }
  .step-ref:hover { background: #fbd5d5; }

  /* Sign-off */
  .lock-msg { font-size: 12px; color: var(--text3); text-align: center; padding: 6px 0 0; display: flex; align-items: center; gap: 5px; justify-content: center; font-weight: 500; }
  .signoff { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.4rem; margin-top: 1rem; }
  .signoff.locked { opacity: 0.45; pointer-events: none; }
  .signoff h3 { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 1.1rem; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 12px; color: var(--text2); font-weight: 500; }
  .form-group input { height: 40px; padding: 0 12px; font-size: 13px; border: 1px solid var(--border2); border-radius: var(--radius); background: var(--surface); color: var(--text); outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
  .form-group input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(214,31,31,0.12); }
  .sig-group { margin-bottom: 14px; }
  .sig-group > label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 6px; font-weight: 500; }
  .sig-box { border: 1.5px dashed var(--border2); border-radius: var(--radius); background: var(--surface); height: 96px; position: relative; overflow: hidden; cursor: crosshair; touch-action: none; transition: border-color 0.15s; }
  .sig-box:hover { border-color: var(--red); }
  .sig-box canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .sig-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--text3); pointer-events: none; }
  .sig-actions { display: flex; gap: 8px; margin-top: 6px; }
  .btn-ghost { font-size: 11px; font-weight: 600; padding: 5px 12px; background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; color: var(--text2); cursor: pointer; transition: all 0.15s; }
  .btn-ghost:hover { background: var(--red-light); color: var(--red); border-color: var(--red); }
  .submit-btn { width: 100%; padding: 12px; background: var(--red); color: #fff; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 1rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s, transform 0.1s; box-shadow: var(--shadow-sm); }
  .submit-btn:hover { background: var(--red-dark); }
  .submit-btn:active { transform: scale(0.99); }

  /* Photo upload */
  .photo-section { margin-top: 1.25rem; }
  .photo-label { font-size: 13px; font-weight: 600; color: var(--text); display: block; margin-bottom: 10px; }
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
  .photo-thumb { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-del { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 6px; border: none; background: rgba(15,23,42,0.65); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .photo-del:hover { background: var(--red); }
  .photo-add { aspect-ratio: 1; border: 1.5px dashed var(--border2); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text3); cursor: pointer; font-size: 11px; font-weight: 600; transition: all 0.15s; background: var(--surface); }
  .photo-add:hover { border-color: var(--red); color: var(--red); }

  /* Action row (print / reset) */
  .action-row { display: flex; gap: 10px; margin-top: 12px; }
  .btn-secondary { flex: 1; padding: 11px; background: var(--surface); color: var(--text); border: 1px solid var(--border2); border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; transition: all 0.15s; }
  .btn-secondary:hover { background: var(--surface2); border-color: var(--text3); }
  .btn-reset { padding: 11px 16px; background: var(--surface); color: var(--text2); border: 1px solid var(--border2); border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; transition: all 0.15s; white-space: nowrap; }
  .btn-reset:hover { background: var(--red-light); color: var(--red); border-color: var(--red); }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.5); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
  .modal-overlay.show { display: flex; animation: fadeIn 0.15s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .modal { background: var(--surface); border-radius: var(--radius-lg); max-width: 580px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(15,23,42,0.3); animation: slideUp 0.2s ease; }
  .modal-header { display: flex; align-items: center; gap: 8px; padding: 1.1rem 1.4rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .modal-header h3 { font-size: 16px; font-weight: 600; flex: 1; letter-spacing: -0.01em; }
  .modal-close { width: 32px; height: 32px; border-radius: 8px; border: none; background: var(--surface2); color: var(--text2); cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .modal-close:hover { background: var(--red-light); color: var(--red); }
  .modal-body { padding: 1.4rem; }
  .modal-diagram { width: 100%; background: #fafbfc; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 1.1rem; overflow: hidden; }
  .modal-caption { font-size: 13.5px; color: var(--text2); line-height: 1.6; }
  .modal-tag { display: inline-block; font-size: 11px; font-weight: 600; color: var(--red); background: var(--red-light); padding: 4px 10px; border-radius: 6px; margin-bottom: 12px; }

  /* Toast */
  .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px); background: #1a1a18; color: #f0f0ee; padding: 10px 20px; border-radius: var(--radius); font-size: 13px; opacity: 0; transition: all 0.3s; z-index: 1100; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Auth screen */
  .auth-wrap { max-width: 400px; margin: 3rem auto 0; padding: 0 1rem; }
  .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2rem 1.75rem; box-shadow: var(--shadow-md); }
  .auth-logo { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg,#d61f1f,#a81414); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; }
  .auth-logo i { font-size: 30px; color: #fff; }
  .auth-card h2 { font-size: 20px; font-weight: 600; text-align: center; letter-spacing: -0.01em; }
  .auth-card .sub { font-size: 13px; color: var(--text2); text-align: center; margin: 6px 0 1.5rem; }
  .auth-field { margin-bottom: 14px; }
  .auth-field label { font-size: 12px; font-weight: 500; color: var(--text2); display: block; margin-bottom: 6px; }
  .auth-field input { width: 100%; height: 44px; padding: 0 12px; font-size: 14px; border: 1px solid var(--border2); border-radius: var(--radius); background: var(--surface); color: var(--text); outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
  .auth-field input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(214,31,31,0.12); }
  .auth-btn { width: 100%; padding: 13px; background: var(--red); color: #fff; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px; transition: background 0.15s; }
  .auth-btn:hover { background: var(--red-dark); }
  .auth-btn:disabled { opacity: 0.6; cursor: default; }
  .auth-toggle { text-align: center; font-size: 13px; color: var(--text2); margin-top: 1.25rem; }
  .auth-toggle a { color: var(--red); font-weight: 600; cursor: pointer; text-decoration: none; }
  .auth-toggle a:hover { text-decoration: underline; }
  .auth-error { background: var(--red-light); color: var(--red-dark); font-size: 12.5px; padding: 9px 12px; border-radius: 8px; margin-bottom: 14px; display: none; }
  .auth-error.show { display: block; }

  /* Top bar with user/logout */
  .topbar { display: flex; align-items: center; gap: 12px; margin: 0 1rem 1.25rem; }
  .topbar .who { font-size: 12.5px; color: var(--text2); margin-left: auto; }
  .topbar button { font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border2); background: var(--surface); color: var(--text2); cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px; }
  .topbar button:hover { background: var(--surface2); color: var(--text); }
  .topbar button.primary { background: var(--red); color: #fff; border-color: var(--red); }
  .topbar button.primary:hover { background: var(--red-dark); }

  /* Supervisor table */
  .sup-wrap { margin: 0 1rem; }
  .sup-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
  .sup-toolbar h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow-x: auto; }
  table.recs { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
  table.recs th { text-align: left; padding: 12px 14px; font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1px solid var(--border); background: var(--surface2); }
  table.recs td { padding: 12px 14px; border-bottom: 1px solid var(--border); color: var(--text); }
  table.recs tr:last-child td { border-bottom: none; }
  table.recs .sig-thumb { height: 30px; border: 1px solid var(--border); border-radius: 4px; background: #fff; }
  .pill { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 12px; background: var(--red-light); color: var(--red-dark); }
  .empty-state { padding: 3rem 1rem; text-align: center; color: var(--text3); font-size: 14px; }

  @media (max-width: 480px) {
    .form-row { grid-template-columns: 1fr; }
    .header h1 { font-size: 16px; }
  }
</style>
</head>
<body>

<!-- ===== AUTH SCREEN ===== -->
<div class="auth-wrap" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo"><i class="ti ti-flame"></i></div>
    <h2 id="authTitle">Sign in</h2>
    <p class="sub">AFC OKC Tech Training Portal</p>
    <div class="auth-error" id="authError"></div>
    <div class="auth-field" id="nameField" style="display:none">
      <label>Full name</label>
      <input type="text" id="authName" placeholder="First Last" autocomplete="name">
    </div>
    <div class="auth-field">
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="authPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="auth-btn" id="authBtn" onclick="doAuth()">Sign in</button>
    <div class="auth-toggle" id="authToggle">
      New tech? <a onclick="toggleAuthMode()">Create an account</a>
    </div>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div class="app" id="mainApp" style="display:none">
  <div class="header">
    <div class="logo"><i class="ti ti-flame"></i></div>
    <div>
      <h1>AFC OKC — Tech training portal</h1>
      <p>Automatic Fire Control Oklahoma City</p>
    </div>
  </div>
  <div class="topbar">
    <button onclick="showTraining()" id="navTraining" class="primary"><i class="ti ti-clipboard-list"></i> Training</button>
    <button onclick="showSupervisor()" id="navSupervisor"><i class="ti ti-table"></i> Records</button>
    <span class="who" id="whoami"></span>
    <button onclick="doLogout()"><i class="ti ti-logout"></i> Log out</button>
  </div>

  <!-- training view -->
  <div id="trainingView">
    <div class="module-grid" id="moduleGrid"></div>
    <div class="content" id="moduleContent"></div>
  </div>

  <!-- supervisor view -->
  <div id="supervisorView" class="sup-wrap" style="display:none">
    <div class="sup-toolbar">
      <h2>Sign-off records</h2>
      <button onclick="exportCSV()" class="primary" style="margin-left:auto;font-size:12px;font-weight:600;padding:8px 14px;border-radius:8px;border:none;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px"><i class="ti ti-download"></i> Export CSV</button>
      <button onclick="loadRecords()" style="font-size:12px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer"><i class="ti ti-refresh"></i></button>
    </div>
    <div class="table-card" id="recordsTable"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Reference</h3>
      <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

// ===== STATE =====
let active = 0;
let activeTab = 'maintain'; // 'install' | 'maintain'
// checked[moduleIndex][tab][stepIndex]
let checked = modules.map(m => ({
  install: new Array(m.install.length).fill(false),
  maintain: new Array(m.maintain.length).fill(false)
}));
// formData[moduleIndex][tab]
function blankPhase() { return { customer: '', serviceDate: '', techName: '', techSig: null, photos: [] }; }
let formData = modules.map(() => ({ install: blankPhase(), maintain: blankPhase() }));

function steps(i, tab) { return modules[i][tab]; }
function pct(i, tab) {
  const arr = checked[i][tab];
  return Math.round(arr.filter(Boolean).length / arr.length * 100);
}
function moduleAvg(i) {
  return Math.round((pct(i, 'install') + pct(i, 'maintain')) / 2);
}
function allDone(i, tab) { return checked[i][tab].every(Boolean); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function renderGrid() {
  document.getElementById('moduleGrid').innerHTML = modules.map((m, i) => `
    <div class="mod-card${i === active ? ' active' : ''}" onclick="setModule(${i})">
      <div class="mod-icon" style="background:${m.iconBg}">
        <i class="ti ${m.icon}" style="color:${m.iconColor}"></i>
      </div>
      <h3>${m.label}</h3>
      <div class="progress-bar"><div class="progress-fill" style="width:${moduleAvg(i)}%"></div></div>
      <div class="mod-pct">${moduleAvg(i)}% complete</div>
    </div>
  `).join('');
}

// ===== SIGNATURE PADS =====
function initSigPad(type, canvasId, placeholderId) {
  const box = document.getElementById('techSigBox');
  const canvas = document.getElementById(canvasId);
  const placeholder = document.getElementById(placeholderId);
  if (!box || !canvas) return;
  canvas.width = box.clientWidth || 600;
  canvas.height = box.clientHeight || 90;
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#cc0000'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  const saved = formData[active][activeTab][type + 'Sig'];
  if (saved) {
    const img = new Image();
    img.onload = () => { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); placeholder.style.display = 'none'; };
    img.src = saved;
  }
  let isDrawing = false, lx = 0, ly = 0;
  function getPos(e) { const r = box.getBoundingClientRect(); const s = e.touches ? e.touches[0] : e; return { x: s.clientX - r.left, y: s.clientY - r.top }; }
  function start(e) { e.preventDefault(); isDrawing = true; const p = getPos(e); lx = p.x; ly = p.y; placeholder.style.display = 'none'; }
  function move(e) { e.preventDefault(); if (!isDrawing) return; const p = getPos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p.x, p.y); ctx.stroke(); lx = p.x; ly = p.y; }
  function end() { isDrawing = false; formData[active][activeTab][type + 'Sig'] = canvas.toDataURL(); }
  box.addEventListener('mousedown', start); box.addEventListener('mousemove', move); box.addEventListener('mouseup', end);
  box.addEventListener('touchstart', start, { passive: false }); box.addEventListener('touchmove', move, { passive: false }); box.addEventListener('touchend', end);
}
function clearSig(type) {
  const canvas = document.getElementById(type + 'Canvas');
  const placeholder = document.getElementById(type + 'Placeholder');
  if (!canvas) return;
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  formData[active][activeTab][type + 'Sig'] = null;
  if (placeholder) placeholder.style.display = 'flex';
}
async function submitModule() {
  const fd = formData[active][activeTab];
  if (!fd.customer.trim()) { showToast('Enter customer / site name'); return; }
  if (!fd.serviceDate) { showToast('Enter service date'); return; }
  if (!fd.techName.trim()) { showToast('Enter technician name before submitting'); return; }
  if (!fd.techSig) { showToast('Technician signature required'); return; }

  const record = {
    module: modules[active].id,
    phase: activeTab,
    customer: fd.customer.trim(),
    service_date: fd.serviceDate,
    tech_name: fd.techName.trim(),
    date_completed: fd.serviceDate,
    tech_signature: fd.techSig,
    checked_steps: checked[active][activeTab],
    photos: fd.photos
  };

  if (sb && currentUser) {
    record.user_id = currentUser.id;
    const { error } = await sb.from('signoffs').insert(record);
    if (error) { showToast('Save failed: ' + error.message); return; }
    showToast(`✓ Saved to records — ${fd.customer.trim()}`);
  } else {
    showToast(`✓ Sign-off submitted — ${fd.customer.trim()}`);
  }
}

// ===== PHOTOS =====
function addPhotos(e) {
  const files = Array.from(e.target.files || []);
  const fd = formData[active][activeTab];
  let pending = files.length;
  if (!pending) return;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      // downscale to keep storage reasonable
      const img = new Image();
      img.onload = () => {
        const max = 1000;
        let { width, height } = img;
        if (width > max || height > max) {
          const r = Math.min(max / width, max / height);
          width = Math.round(width * r); height = Math.round(height * r);
        }
        const c = document.createElement('canvas');
        c.width = width; c.height = height;
        c.getContext('2d').drawImage(img, 0, 0, width, height);
        fd.photos.push(c.toDataURL('image/jpeg', 0.8));
        if (--pending === 0) renderContent();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function removePhoto(pi) {
  formData[active][activeTab].photos.splice(pi, 1);
  renderContent();
}

function resetTab() {
  if (!confirm('Reset this tab for a new site? This clears the checklist, customer info, photos, and signatures on the current tab.')) return;
  const m = modules[active];
  checked[active][activeTab] = new Array(m[activeTab].length).fill(false);
  formData[active][activeTab] = blankPhase();
  renderGrid();
  renderContent();
  showToast('Tab reset — ready for next site');
}

    .citem .num { color: #cbd5e1; font-weight: 700; font-size: 10px; min-width: 14px; padding-top: 1px; }
    .box { display: inline-block; width: 13px; height: 13px; border-radius: 3px; border: 1.5px solid #cbd5e1; position: relative; flex-shrink: 0; margin-top: 1px; }
    .box.on { background: #16a34a; border-color: #16a34a; }
    .box.on::after { content: ''; position: absolute; left: 3.5px; top: 1px; width: 4px; height: 7px; border-right: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(45deg); }
    .rphotos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .rphotos img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 6px; border: 1px solid #e2e8f0; }
    .rsig { margin-top: 6px; border: 1px solid #e2e8f0; border-radius: 10px; padding: 11px 14px; max-width: 300px; }
    .rsig span { font-size: 9px; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .rsig .line { border-bottom: 1px solid #e2e8f0; height: 44px; display: flex; align-items: center; }
    .rsig img { max-height: 42px; }
    .rsig .name { margin-top: 6px; font-size: 13px; font-weight: 600; color: #0f172a; }
    .rfoot { margin-top: 18px; padding-top: 12px; border-top: 1px solid #f1f5f9; font-size: 10px; color: #94a3b8; display: flex; justify-content: space-between; gap: 16px; }
  </style></head><body>
    <div class="rhead">
      <div class="rlogo">▲</div>
      <div>
        <h1>Automatic Fire Control</h1>
        <p>Fire Protection Service Report · Oklahoma City, OK</p>
      </div>
    </div>
    <div class="rbar"></div>
    <div class="rmeta">
      <div class="cell full"><span>Customer / Site</span><strong>${escapeHtml(data.customer)}</strong></div>
      <div class="cell"><span>Service Date</span><strong>${escapeHtml(fmtDate(data.serviceDate))}</strong></div>
      <div class="cell"><span>System</span><strong>${escapeHtml(data.moduleLabel)}</strong></div>
      <div class="cell"><span>Service Type</span><strong>${escapeHtml(data.phaseLabel)}</strong></div>
    </div>
    <div class="rsection">
      <h3>${escapeHtml(data.phaseLabel)} Checklist</h3>
      <div class="checklist">${stepsRows}</div>
    </div>
    ${photosHTML}
    <div class="rsection">
      <h3>Technician Certification</h3>
      <div class="rsig">
        <span>Signature</span>
        <div class="line">${data.techSig ? `<img src="${data.techSig}">` : ''}</div>
        <div class="name">${escapeHtml(data.techName)}</div>
      </div>
    </div>
    <div class="rfoot">
      <span>Generated ${new Date().toLocaleDateString()} · Automatic Fire Control, OKC</span>
      <span>This report certifies the work indicated above was performed per applicable NFPA standards.</span>
    </div>
  </body></html>`;
}
function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  return isNaN(dt) ? d : dt.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
}

async function downloadReportPDF(data) {
  const html = buildReportHTML(data);
  // render into an offscreen container
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-9999px;top:0;';
  const frame = document.createElement('iframe');
  frame.style.cssText = 'width:760px;border:0;';
  holder.appendChild(frame);
  document.body.appendChild(holder);
  const doc = frame.contentDocument;
  doc.open(); doc.write(html); doc.close();

  // wait for images to load
  await new Promise(res => setTimeout(res, 350));
  const imgs = Array.from(doc.images);
  await Promise.all(imgs.map(im => im.complete ? Promise.resolve() : new Promise(r => { im.onload = im.onerror = r; })));

  const fileBase = `AFC-Report-${(data.customer||'site').replace(/[^a-z0-9]+/gi,'-')}-${data.serviceDate||''}`.replace(/-+$/,'');

  try {
    const body = doc.body;
    const canvas = await html2canvas(body, { scale: 2, backgroundColor: '#ffffff', windowWidth: 760 });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageW = 210, pageH = 297, margin = 0;
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    // Fit the whole report onto ONE page: scale to whichever dimension is the constraint
    const ratio = canvas.width / canvas.height;
    let imgW = pageW, imgH = imgW / ratio;
    if (imgH > pageH) { imgH = pageH; imgW = imgH * ratio; }
    const x = (pageW - imgW) / 2, y = (pageH - imgH) / 2;
    pdf.addImage(imgData, 'JPEG', x, y, imgW, imgH);
    pdf.save(fileBase + '.pdf');
    showToast('Report downloaded');
  } catch (e) {
    // fallback: download the HTML file if PDF libs failed to load
    const blob = new Blob([html], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileBase + '.html';
    a.click();
    showToast('Report downloaded (HTML)');
  } finally {
    document.body.removeChild(holder);
  }
}

function printReport() {
  const fd = formData[active][activeTab];
  if (!fd.customer.trim() || !fd.serviceDate) { showToast('Enter customer name and service date first'); return; }
  if (!fd.techSig) { showToast('Add the technician signature first'); return; }
  showToast('Building report…');
  downloadReportPDF({
    moduleLabel: modules[active].label,
    phaseLabel: activeTab === 'install' ? 'Installation' : 'Maintenance & inspection',
    customer: fd.customer, serviceDate: fd.serviceDate,
    techName: fd.techName,
    steps: modules[active][activeTab].map((s, i) => ({ t: s.t, checked: checked[active][activeTab][i] })),
    techSig: fd.techSig, photos: fd.photos
  });
}

function printRecord(idx) {
  const r = loadedRecords[idx];
  if (!r) return;
  const phaseSteps = (modules.find(m => m.id === r.module) || {})[r.phase] || [];
  showToast('Building report…');
  downloadReportPDF({
    moduleLabel: moduleLabel[r.module] || r.module,
    phaseLabel: r.phase === 'install' ? 'Installation' : 'Maintenance & inspection',
    customer: r.customer || '—', serviceDate: r.service_date || r.date_completed,
    techName: r.tech_name,
    steps: phaseSteps.map((s, i) => ({ t: s.t, checked: (r.checked_steps || [])[i] })),
    techSig: r.tech_signature, photos: r.photos || []
  });
}

// ===== VIEW SWITCHING =====
function showTraining() {
  document.getElementById('trainingView').style.display = '';
  document.getElementById('supervisorView').style.display = 'none';
  document.getElementById('navTraining').classList.add('primary');
  document.getElementById('navSupervisor').classList.remove('primary');
}
function showSupervisor() {
  document.getElementById('trainingView').style.display = 'none';
  document.getElementById('supervisorView').style.display = '';
  document.getElementById('navSupervisor').classList.add('primary');
  document.getElementById('navTraining').classList.remove('primary');
  loadRecords();
}

// ===== RECORDS / SUPERVISOR =====
let loadedRecords = [];
const moduleLabel = { hood:'Kitchen hood', clean:'Clean agent', alarm:'Fire alarm', sprinkler:'Sprinkler' };
async function loadRecords() {
  const el = document.getElementById('recordsTable');
  if (!sb) { el.innerHTML = '<div class="empty-state">Backend not configured yet — paste your Supabase URL and key at the top of the file.</div>'; return; }
  el.innerHTML = '<div class="empty-state">Loading…</div>';
  const { data, error } = await sb.from('signoffs').select('*').order('created_at', { ascending: false });
  if (error) { el.innerHTML = '<div class="empty-state">Error: ' + error.message + '</div>'; return; }
  loadedRecords = data || [];
  if (!loadedRecords.length) { el.innerHTML = '<div class="empty-state">No sign-offs recorded yet.</div>'; return; }
  el.innerHTML = `
    <table class="recs">
      <thead><tr>
        <th>Service date</th><th>Customer</th><th>Module</th><th>Phase</th><th>Technician</th><th>Signature</th><th></th>
      </tr></thead>
      <tbody>
        ${loadedRecords.map((r, idx) => `
          <tr>
            <td>${r.service_date || r.date_completed}</td>
            <td>${escapeHtml(r.customer || '—')}</td>
            <td>${moduleLabel[r.module] || r.module}</td>
            <td><span class="pill">${r.phase === 'install' ? 'Install' : 'Maintain'}</span></td>
            <td>${escapeHtml(r.tech_name)}</td>
            <td style="white-space:nowrap">
              <img class="sig-thumb" src="${r.tech_signature}" alt="tech signature">
            </td>
            <td><button onclick="printRecord(${idx})" style="font-size:11px;font-weight:600;padding:6px 10px;border-radius:7px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer;display:inline-flex;align-items:center;gap:4px"><i class="ti ti-printer" style="font-size:13px"></i> Report</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function exportCSV() {
  if (!loadedRecords.length) { showToast('No records to export'); return; }
  const rows = [['Service date','Customer','Module','Phase','Technician','Date completed','Submitted']];
  loadedRecords.forEach(r => rows.push([
    r.service_date || r.date_completed, r.customer || '', moduleLabel[r.module] || r.module,
    r.phase, r.tech_name, r.date_completed, new Date(r.created_at).toLocaleString()
  ]));
  const csv = rows.map(row => row.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `afc-signoffs-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast('CSV downloaded');
}

// ===== AUTH =====
let authMode = 'signin'; // 'signin' | 'signup'
function toggleAuthMode() {
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  document.getElementById('authTitle').textContent = authMode === 'signin' ? 'Sign in' : 'Create account';
  document.getElementById('authBtn').textContent = authMode === 'signin' ? 'Sign in' : 'Create account';
  document.getElementById('nameField').style.display = authMode === 'signup' ? '' : 'none';
  document.getElementById('authToggle').innerHTML = authMode === 'signin'
    ? 'New tech? <a onclick="toggleAuthMode()">Create an account</a>'
    : 'Already have an account? <a onclick="toggleAuthMode()">Sign in</a>';
  hideAuthError();
}
function showAuthError(msg) { const e = document.getElementById('authError'); e.textContent = msg; e.classList.add('show'); }
function hideAuthError() { document.getElementById('authError').classList.remove('show'); }

async function doAuth() {
  hideAuthError();
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  const name = document.getElementById('authName').value.trim();
  if (!email || !pass) { showAuthError('Enter email and password.'); return; }
  if (authMode === 'signup' && !name) { showAuthError('Enter your full name.'); return; }
  if (!sb) { showAuthError('Backend not configured. Paste your Supabase URL and key at the top of the file.'); return; }

  const btn = document.getElementById('authBtn');
  btn.disabled = true; btn.textContent = 'Please wait…';

  try {
    if (authMode === 'signup') {
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { full_name: name } } });
      if (error) throw error;
      if (data.session) { onSignedIn(data.user); }
      else { showAuthError('Account created. If email confirmation is on, check your inbox, then sign in.'); toggleAuthMode(); }
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      onSignedIn(data.user);
    }
  } catch (e) {
    showAuthError(e.message || 'Authentication failed.');
  } finally {
    btn.disabled = false;
    btn.textContent = authMode === 'signin' ? 'Sign in' : 'Create account';
  }
}

async function doLogout() {
  if (sb) await sb.auth.signOut();
  currentUser = null;
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('authScreen').style.display = '';
}

function onSignedIn(user) {
  currentUser = user;
  const name = (user.user_metadata && user.user_metadata.full_name) || user.email;
  document.getElementById('whoami').textContent = 'Signed in as ' + name;
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = '';
  showTraining();
  renderGrid();
  renderContent();
}

// ===== INIT =====
async function init() {
  // allow Enter key on auth
  ['authEmail','authPass','authName'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });
  });
  if (sb) {
    const { data } = await sb.auth.getSession();
    if (data.session) { onSignedIn(data.session.user); return; }
  }
  // not signed in (or no backend) — show auth screen
  document.getElementById('authScreen').style.display = '';
}
init();
</script>
